services:
  - type: web
    name: arboles-teoria-grafos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m compileall -q kruskal_app
    startCommand: python -m kruskal_app.adapters.web --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arboles-teoria-grafos-db
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true

databases:
  - name: arboles-teoria-grafos-db
    databaseName: arboles_historial
    user: arboles_app
    plan: basic-256mb
